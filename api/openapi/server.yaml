openapi: 3.0.3
info:
  version: 1.0.0
  title: Gophermart
  description: Gophermart
tags:
  - name: User
    description: Пользователи.
paths:
  /user/register:
    post:
      operationId: post_user_register
      tags:
        - User
      summary: Регистрация пользователя.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              title: Registration
              required:
                - login
                - password
              properties:
                login:
                  title: Логин.
                  type: string
                password:
                  title: Пароль.
                  type: string
      responses:
        '200':
          $ref: './responses/OK.yaml'
        '400':
          $ref: './responses/BadRequest.yaml'
        '409':
          $ref: './responses/Conflict.yaml'
        '500':
          $ref: './responses/InternalServerError.yaml'

  /user/login:
    post:
      operationId: post_user_login
      tags:
        - User
      summary: Аутентификация пользователя.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              title: Login
              required:
                - login
                - password
              properties:
                login:
                  title: Логин.
                  type: string
                password:
                  title: Пароль.
                  type: string
      responses:
        '200':
          $ref: './responses/OK.yaml'
        '400':
          $ref: './responses/BadRequest.yaml'
        '401':
          $ref: './responses/Unauthorized.yaml'
        '500':
          $ref: './responses/InternalServerError.yaml'

  /user/orders:
    post:
      operationId: post_user_orders
      security:
        - NeedAuth: []
      tags:
        - User
      summary: Загрузка пользователем номера заказа для расчёта.
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
              description: Номер заказа.
      responses:
        '200':
          $ref: './responses/OK.yaml'
        '202':
          $ref: './responses/Accepted.yaml'
        '400':
          $ref: './responses/BadRequest.yaml'
        '401':
          $ref: './responses/Unauthorized.yaml'
        '409':
          $ref: './responses/Conflict.yaml'
        '422':
          $ref: './responses/UnprocessableEntity.yaml'
        '500':
          $ref: './responses/InternalServerError.yaml'

    get:
      operationId: get_user_orders
      security:
        - NeedAuth: []
      tags:
        - User
      summary: Получение списка загруженных пользователем номеров заказов, статусов их обработки и информации о начислениях.
      requestBody:
        content:
          application/json: { }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '204':
          $ref: './responses/NoContent.yaml'
        '401':
          $ref: './responses/Unauthorized.yaml'
        '500':
          $ref: './responses/InternalServerError.yaml'

  /user/balance:
    get:
      operationId: get_user_balance
      security:
        - NeedAuth: []
      tags:
        - User
      summary: Получение текущего баланса счёта баллов лояльности пользователя.
      requestBody:
        content:
          application/json: { }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'

        '204':
          $ref: './responses/NoContent.yaml'
        '401':
          $ref: './responses/Unauthorized.yaml'
        '500':
          $ref: './responses/InternalServerError.yaml'

  /user/balance/withdraw:
    post:
      operationId: post_user_balance_withdraw
      security:
        - NeedAuth: []
      tags:
        - User
      summary: Запрос на списание баллов с накопительного счёта в счёт оплаты нового заказа.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              title: WithdrawRequest
              required:
                - order
                - sum
              properties:
                order:
                  type: string
                sum:
                  type: number
                  format: double
      responses:
        '200':
          $ref: './responses/OK.yaml'
        '401':
          $ref: './responses/Unauthorized.yaml'
        '402':
          $ref: './responses/PaymentRequired.yaml'
        '422':
          $ref: './responses/UnprocessableEntity.yaml'
        '500':
          $ref: './responses/InternalServerError.yaml'

  /user/withdrawals:
    get:
      operationId: get_user_withdraws
      security:
        - NeedAuth: []
      tags:
        - User
      summary: Получение информации о выводе средств с накопительного счёта пользователем.
      requestBody:
        content:
          application/json: { }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Withdrawal'
        '204':
          $ref: './responses/NoContent.yaml'
        '401':
          $ref: './responses/Unauthorized.yaml'
        '500':
          $ref: './responses/InternalServerError.yaml'

components:
  schemas:
    Balance:
      type: object
      description: Информация по балансу пользователя.
      required:
        - current
        - withdrawn
      properties:
        current:
          type: number
          format: double
          description: Сумма баллов лояльности.
        withdrawn:
          type: number
          format: double
          description: Сумма использованных за весь период регистрации баллов.
    Order:
      type: object
      required:
        - number
        - status
        - uploaded_at
      properties:
        number:
          type: string
          description: Номер заказа.
        status:
          type: string
          enum:
            - 'NEW'
            - 'PROCESSING'
            - 'INVALID'
            - 'PROCESSED'
          description: Статус заказа.
        accrual:
          type: number
          format: double
          description: Рассчитанные баллы к начислению.
        uploaded_at:
          type: string
    Withdrawal:
      type: object
      required:
        - order
        - sum
        - processed_at
      properties:
        order:
          type: string
        sum:
          type: number
          format: double
        processed_at:
          type: string
